# Rebuild every ADaM dataset, the XPT files, define.xml, tables and figures;
# compare with the published pilot ADaM; run the R test suite; then check the
# exports from Python: cross-check, define.xml schema validation and ADaM
# conformance checks. If a run fails on a missing system library, the fix is
# almost always one more package in the apt-get line below.
name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
            libtiff5-dev libjpeg-dev pandoc

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Rebuild datasets, compare with the pilot and run tests
        run: Rscript run_all.R

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python checks (cross-check, define.xml, ADaM conformance)
        run: |
          pip install pandas lxml odmlib==0.2.1
          python3 python/check_adam.py
          python3 python/validate_define.py
          python3 python/adam_conformance.py

      - name: Keep the QC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-reports
          path: outputs/qc/
