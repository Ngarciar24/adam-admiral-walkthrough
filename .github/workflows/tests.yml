# Rebuild every ADaM dataset from SDTM, export the XPT files, draw the figure,
# run the R test suite, then re-check the exports from Python. If a run fails on
# a missing system library, the fix is almost always one more package in the
# apt-get line below.
name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev \
            libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev \
            libtiff5-dev libjpeg-dev pandoc

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      - name: Rebuild datasets and run tests
        run: Rscript run_all.R

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cross-check the XPT exports from Python
        run: |
          pip install pandas
          python3 python/check_adam.py
